# Refresh long-lived docs caches so they stay inside GitHub Actions' 7-day
# eviction window even if master does not push a docs build for a while.
#
# Restoring a cache updates its ``last_accessed_at``, which is what GHA's LRU
# policy uses to decide what to evict when the repo-wide 10 GB quota is hit.
# Running this weekly on master keeps the ``docs-mne-data-*`` and
# ``docs-hf-hub-v2-*`` caches alive between PR / master doc builds.
name: cache-keepalive

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  touch-docs-caches:
    # Only run on the default branch; caches created here are visible to PR
    # builds via GHA's base-branch cache scoping.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch MNE data cache
        uses: actions/cache/restore@v4
        with:
          path: ~/mne_data
          key: docs-mne-data-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            docs-mne-data-

      - name: Touch HuggingFace Hub cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface/hub
          key: docs-hf-hub-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            docs-hf-hub-v2-
