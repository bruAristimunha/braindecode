name: docs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - '*' # all branches, including forks

jobs:
  build_docs:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HUGGING_FACE_TOKEN }}
    steps:
      ## Install Braindecode
      - name: Checking Out Repository
        uses: actions/checkout@v4
      # Install python
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Cache MNE Data
      # Dedicated cache for docs (single platform: ubuntu-latest)
      # Cache key includes hash of pyproject.toml to invalidate when dependencies change
      - name: Create/Restore MNE Data Cache
        id: cache-mne_data
        uses: actions/cache@v4
        with:
          path: ~/mne_data
          key: docs-mne-data-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            docs-mne-data-
      # Cache HuggingFace Hub models.
      # Bump the ``-v2`` suffix to force a fresh populate whenever the prune
      # strategy below changes; ``restore-keys`` only falls back to other
      # ``-v2`` caches, so the older unpruned ``docs-hf-hub-*`` cache is
      # ignored.
      - name: Create/Restore HuggingFace Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: docs-hf-hub-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            docs-hf-hub-v2-
      # Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      # Install with all dependencies for doc build to go through
      - name: Install with doc dependencies
        run: uv pip install --system -e .[all]
      # Show Braindecode Version
      - run: python -c "import braindecode; print(braindecode.__version__)"
      # Persist HF token to disk so sphinx-gallery examples can access gated repos
      - name: Login to Hugging Face Hub
        if: ${{ env.HF_TOKEN != '' }}
        run: python -c "import os; from huggingface_hub import login; login(token=os.environ['HF_TOKEN'])"
      - name: Create Docs
        run: |
          cd docs
          make html

      # Drop stale revisions + empty ``.no_exist`` markers from the HF Hub
      # cache before the post-job cache save. Each HF repo often accumulates
      # multiple revisions across runs (the sha pinned when the example last
      # ran); only the most recent revision is ever hit again, so older ones
      # are pure bloat.
      - name: Prune HuggingFace Hub cache
        if: always()
        run: |
          python - <<'PY'
          from huggingface_hub import scan_cache_dir

          def fmt_gb(n):
              return f"{n / 1024 ** 3:.2f} GB"

          info = scan_cache_dir()
          print(f"HF hub before prune: {fmt_gb(info.size_on_disk)} "
                f"across {len(info.repos)} repos")
          to_delete = []
          for repo in info.repos:
              revs = sorted(
                  repo.revisions,
                  key=lambda r: r.last_modified or 0,
                  reverse=True,
              )
              for stale in revs[1:]:
                  to_delete.append(stale.commit_hash)
          if to_delete:
              info.delete_revisions(*to_delete).execute()
          info = scan_cache_dir()
          print(f"HF hub after prune: {fmt_gb(info.size_on_disk)} "
                f"across {len(info.repos)} repos")
          PY

      - name: Generate Notebooks from Examples
        run: |
          set -euo pipefail
          echo "Converting Python examples to notebooks in docs/_build/html/auto_examples/_notebooks..."
          mkdir -p docs/_build/html/auto_examples/_notebooks
          find examples -type f -name '*.py' | while read -r f; do
            rel="${f#examples/}"
            out_dir="docs/_build/html/auto_examples/_notebooks/$(dirname "$rel")"
            mkdir -p "$out_dir"
            base="$(basename "$rel" .py)"
            out_path="$out_dir/$base.ipynb"
            python .github/scripts/convert_to_notebook.py --input "$f" --output "$out_path"
          done

      - name: Upload HTML Docs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Docs
          path: ./docs/_build/

      - name: Deploy to Github Pages if on Master
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: braindecode/braindecode.github.io
          destination_dir: dev
          publish_branch: master
          publish_dir: ./docs/_build/html
          cname: braindecode.org
