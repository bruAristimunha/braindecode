name: Verify Braindecode release PRs in groups
on:
  push:
    branches: [audit/20261119-check-71]
permissions:
  contents: read
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  TORCHINDUCTOR_COMPILE_THREADS: '1'
  MAX_JOBS: '1'
  UV_TORCH_BACKEND: cpu
  BRAINDECODE_COMPILE_ALL: '1'
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group: [outside-models, models, slow, compile-0, compile-1, compile-2, compile-3, acceptance]
    name: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 644bb65df0bcb21ad1c303b260b98883f3b65c2e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e '.[tests,moabb,hub,eegprep,typing,viz]'
      - uses: actions/cache/restore@v4
        if: matrix.group == 'outside-models' || matrix.group == 'acceptance'
        with:
          path: ~/mne_data
          key: test-2-Linux-3.12
      - name: Warm the real-data cache before starting workers
        if: matrix.group == 'outside-models' || matrix.group == 'acceptance'
        run: python -c 'from moabb.datasets import BNCI2014_001; BNCI2014_001().get_data([1, 2, 4])'
      - name: Run the selected tests
        env:
          GROUP: ${{ matrix.group }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          group = os.environ['GROUP']
          runner = [sys.executable, '-m', 'pytest']
          arguments = {
              'outside-models': ['test', '--ignore=test/unit_tests/models', '-n', '2', '--dist', 'worksteal'],
              'models': ['test/unit_tests/models', '-k', 'not test_model_compiled', '-n', '2', '--dist', 'worksteal'],
              'slow': ['test', '-m', 'slow', '-n', '0'],
              'acceptance': ['test/acceptance_tests', '--run-network', '-n', '0'],
          }
          if group.startswith('compile-'):
              module = 'test/unit_tests/models/test_integration.py'
              listing = subprocess.check_output(runner + ['--collect-only', '-q', module, '-k', 'test_model_compiled'], text=True)
              nodes = [line for line in listing.splitlines() if line.startswith(module + '::test_model_compiled[')]
              assert nodes and len(nodes) == len(set(nodes)), listing
              shard = nodes[int(group.removeprefix('compile-'))::4]
              assert shard
              print(f'Running {len(shard)} of {len(nodes)} collected compiler cases', flush=True)
              selected = ['-n', '0', *shard]
          else:
              selected = arguments[group]
          sys.exit(subprocess.call(runner + ['-v', '--durations=20', '--junitxml=release-results.xml', *selected]))
      - name: Save pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.group }}
          path: release-results.xml
          if-no-files-found: ignore
  wheels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 644bb65df0bcb21ad1c303b260b98883f3b65c2e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/check-wheel
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 644bb65df0bcb21ad1c303b260b98883f3b65c2e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv pip install --system -e '.[docs,moabb,hub,eegprep,typing,viz]'
      - name: Build the API and guides
        env:
          BRAINDECODE_DOCS_JOBS: '1'
          MPLBACKEND: Agg
        run: make -C docs html SPHINXOPTS='-j 2 -D plot_gallery=0'
